AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coolture Embedding Workers

Parameters:
  Environment:
    Type: String
    Default: local
    AllowedValues: [local, dev, staging, prod]
  BaseStackName:
    Type: String
    Default: coolture-base-dev
  BackendStackName:
    Type: String
    Default: coolture-backend-dev
  DbName:
    Type: String
    Default: coolture
  DbUsername:
    Type: String
    Default: coolture_admin
  DbPassword:
    Type: String
    Default: admin
    NoEcho: true
    Description: Local only - on AWS the workers use IAM database authentication
  DbAppUsername:
    Type: String
    Default: coolture_app
  DbHost:
    Type: String
    Default: host.docker.internal
  DbPort:
    Type: String
    Default: '5430'
  LogRetentionDays:
    Type: Number
    Default: 7
  UserEmbeddingScheduleEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  UserEmbeddingSchedule:
    Type: String
    Default: 'cron(0/30 8-15 ? * * *)'
    Description: Every 30 minutes from 08:00 to 15:30 (last run before 16:00) in UserEmbeddingScheduleTimezone
  UserEmbeddingScheduleTimezone:
    Type: String
    Default: Europe/Warsaw

Conditions:
  IsAWS: !Not [!Equals [!Ref Environment, 'local']]
  UserEmbeddingScheduleOn: !And
    - !Condition IsAWS
    - !Equals [!Ref UserEmbeddingScheduleEnabled, 'true']

Globals:
  Function:
    Architectures: !If [IsAWS, [arm64], [x86_64]]
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_HOST: !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbEndpoint'}, !Ref DbHost]
        DB_PORT: !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbPort'}, !Ref DbPort]
        DB_NAME: !Ref DbName
        DB_USERNAME: !If [IsAWS, !Ref DbAppUsername, !Ref DbUsername]
        DB_PASSWORD: !If [IsAWS, '', !Ref DbPassword]
        DB_IAM_AUTH: !If [IsAWS, 'true', 'false']
        DB_CONNECT_TIMEOUT_SECONDS: !If [IsAWS, '30', '5']
    Tags:
      Project: coolture
      Environment: !Ref Environment

Resources:
  PostEmbeddingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-post-embedding'
      RetentionInDays: !Ref LogRetentionDays

  PostEmbeddingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-embedding'
      LoggingConfig:
        LogGroup: !Ref PostEmbeddingLogGroup
      PackageType: Image
      MemorySize: 2048
      Timeout: 120
      Policies:
        - !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbConnectPolicyArn'}, !Ref AWS::NoValue]
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BackendStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        PostEmbeddingMessages:
          Type: SQS
          Properties:
            Queue: !If
              - IsAWS
              - !ImportValue {'Fn::Sub': '${BackendStackName}-PostEmbeddingQueueArn'}
              - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:coolture-${Environment}-post-embedding'
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: post-embedding
      DockerTag: python3.13-v1

  UserEmbeddingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-user-embedding'
      RetentionInDays: !Ref LogRetentionDays

  UserEmbeddingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-user-embedding'
      LoggingConfig:
        LogGroup: !Ref UserEmbeddingLogGroup
      CodeUri: user-embedding/src/
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 300
      Policies:
        - !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbConnectPolicyArn'}, !Ref AWS::NoValue]
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BackendStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        WorkingHours:
          Type: ScheduleV2
          Properties:
            Name: !Sub 'coolture-${Environment}-user-embedding'
            ScheduleExpression: !Ref UserEmbeddingSchedule
            ScheduleExpressionTimezone: !Ref UserEmbeddingScheduleTimezone
            State: !If [UserEmbeddingScheduleOn, ENABLED, DISABLED]

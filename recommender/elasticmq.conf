include classpath("application.conf")
node-address { protocol = http, host = "*", port = 9324 }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
messages-storage { enabled = true }
aws { region = "eu-north-1", accountId = "000000000000" }
queues {
  coolture-recommendation-events {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 2 seconds
    deadLettersQueue { name = "coolture-recommendation-dlq", maxReceiveCount = 5 }
  }
  coolture-recommendation-dlq {}
}


AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coolture Embedding Workers

Parameters:
  Environment:
    Type: String
    Default: local
    AllowedValues: [local, dev, staging, prod]
  BaseStackName:
    Type: String
    Default: mgmt-stack-networking
  BackendStackName:
    Type: String
    Default: coolture-backend-dev
  DbName:
    Type: String
    Default: coolture
  DbUsername:
    Type: String
    Default: coolture_admin
  DbPassword:
    Type: String
    Default: admin
    NoEcho: true
  DbAppUsername:
    Type: String
    Default: coolture_app
  DbHost:
    Type: String
    Default: host.docker.internal
  DbPort:
    Type: String
    Default: '5430'
  GraphScheduleEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GraphSchedule:
    Type: String
    Default: 'rate(6 hours)'
  LogRetentionDays:
    Type: Number
    Default: 7

Conditions:
  IsAWS: !Not [!Equals [!Ref Environment, 'local']]
  GraphScheduleOn: !And [!Condition IsAWS, !Equals [!Ref GraphScheduleEnabled, 'true']]

Globals:
  Function:
    Architectures: !If [IsAWS, [arm64], [x86_64]]
    VpcConfig: !If
      - IsAWS
      - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
        SecurityGroupIds: [!ImportValue {'Fn::Sub': '${BackendStackName}-LambdaSecurityGroupId'}]
      - !Ref AWS::NoValue
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_HOST: !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbEndpoint'}, !Ref DbHost]
        DB_PORT: !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbPort'}, !Ref DbPort]
        DB_NAME: !Ref DbName
        DB_USERNAME: !If [IsAWS, !Ref DbAppUsername, !Ref DbUsername]
        DB_PASSWORD: !If [IsAWS, '', !Ref DbPassword]
        DB_IAM_AUTH: !If [IsAWS, 'true', 'false']
        DB_CONNECT_TIMEOUT_SECONDS: !If [IsAWS, '30', '5']
    Tags:
      Project: coolture
      Environment: !Ref Environment

Resources:
  PostEmbeddingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-post-embedding'
      RetentionInDays: !Ref LogRetentionDays

  PostEmbeddingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-embedding'
      LoggingConfig:
        LogGroup: !Ref PostEmbeddingLogGroup
      PackageType: Image
      MemorySize: 2048
      Timeout: 120
      Policies:
        - !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbConnectPolicyArn'}, !Ref AWS::NoValue]
      Events:
        PostEmbeddingMessages:
          Type: SQS
          Properties:
            Queue: !If
              - IsAWS
              - !ImportValue {'Fn::Sub': '${BackendStackName}-PostEmbeddingQueueArn'}
              - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:coolture-${Environment}-post-embedding'
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: post-embedding
      DockerTag: python3.13-v1

  GraphSignalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-graph-signal'
      RetentionInDays: !Ref LogRetentionDays

  GraphSignalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-graph-signal'
      LoggingConfig:
        LogGroup: !Ref GraphSignalLogGroup
      CodeUri: ../graph-signal/src/
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 1024
      Timeout: 300
      Policies:
        - !If [IsAWS, !ImportValue {'Fn::Sub': '${BackendStackName}-DbConnectPolicyArn'}, !Ref AWS::NoValue]
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref GraphSchedule
            State: !If [GraphScheduleOn, ENABLED, DISABLED]

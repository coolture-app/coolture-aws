x-queue: &queue
  SQS_ENDPOINT_URL: http://sqs:9324
  SCORES_QUEUE_URL: http://sqs:9324/000000000000/coolture-recommendation-events
  AWS_DEFAULT_REGION: eu-north-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local

services:
  postgres:
    build: ./db
    platform: linux/amd64
    image: coolture-aws-postgres:latest
    container_name: coolture-postgres
    ports:
      - "5430:5432"
    environment:
      POSTGRES_DB: coolture
      POSTGRES_USER: coolture_admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolture_admin -d coolture"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies migrations/ with the same runner as on AWS, then db/local-dev-seed.sql. Safe to re-run.
  migrate:
    build:
      context: ./aws/lambdas/migrations/src
      dockerfile_inline: |
        FROM python:3.13-slim
        COPY requirements.txt /tmp/requirements.txt
        RUN pip install --no-cache-dir -r /tmp/requirements.txt
    image: coolture-aws-migrate:latest
    working_dir: /runner
    command:
      - python
      - -c
      - |
        import logging, pathlib, app
        logging.basicConfig(level=logging.INFO)
        app.run_migrations()
        with app.connect() as conn:
            conn.execute(pathlib.Path('/seed/local-dev-seed.sql').read_text(encoding='utf-8'))
        print('applied db/local-dev-seed.sql')
    environment:
      MIGRATIONS_DIR: /migrations
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: coolture
      DB_USERNAME: coolture_admin
      DB_PASSWORD: admin
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./aws/lambdas/migrations/src:/runner:ro
      - ./migrations:/migrations:ro
      - ./db/local-dev-seed.sql:/seed/local-dev-seed.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  s3garage:
    image: dxflrs/garage:v2.2.0
    container_name: coolture-s3garage
    restart: unless-stopped
    ports:
      - "${GARAGE_API_HOST_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_HOST_PORT:-3910}:3910"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-daf48455f5042d06df2547601eba458980eb2397126d04f9d21545298bfb5dc3}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:-b568f9316f65f416254617b30b03acf4683d8993f7b6d787344a7b4daa214848}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN:-315a7ac6a5860ef3e7bcdccec64bf26c978b40b09fec13c955682a2e87a77566}

  s3-init:
    image: docker.io/alpine:3.23
    container_name: coolture-s3-init
    depends_on:
      s3garage:
        condition: service_started
    network_mode: service:s3garage
    pid: service:s3garage
    volumes:
      - ./garage/init.sh:/init.sh:ro
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-daf48455f5042d06df2547601eba458980eb2397126d04f9d21545298bfb5dc3}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-b568f9316f65f416254617b30b03acf4683d8993f7b6d787344a7b4daa214848}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-GK9f23fc115cfabe3da0a5bcb5}
      GARAGE_ACCESS_KEY_SECRET: ${GARAGE_ACCESS_KEY_SECRET:-8fa745da69f465aff2fafb09ab290c6358e6e58c0ec3d3fc174d27f300688111}
      GARAGE_BUCKET_NAME: ${GARAGE_BUCKET_NAME:-coolture-bucket}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME:-coolture-key}
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-GK9f23fc115cfabe3da0a5bcb5}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_ACCESS_KEY_SECRET:-8fa745da69f465aff2fafb09ab290c6358e6e58c0ec3d3fc174d27f300688111}
      AWS_DEFAULT_REGION: ${GARAGE_REGION:-garage}
    restart: on-failure:3
    entrypoint: ["/bin/sh", "/init.sh"]

  # Recommender (docker compose --profile rec): local SQS and the worker that stores graph scores.
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    profiles: [rec, graph]
    ports:
      - "127.0.0.1:${SQS_PORT:-9324}:9324"
    volumes:
      - ./recommender/elasticmq.conf:/opt/elasticmq.conf:ro
      - sqs-data:/data

  worker:
    build: ./recommender
    image: coolture-aws-recommender:latest
    profiles: [rec]
    command: [python, local_runner.py, worker]
    environment:
      <<: *queue
      DATABASE_URL: postgresql://coolture_admin:admin@postgres:5432/coolture
    volumes:
      - ./recommender:/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      sqs:
        condition: service_started

  # AuraDB graph gateway (docker compose --profile graph run --rm graph-gateway), credentials in recommender/.env.
  graph-gateway:
    build: ./recommender
    image: coolture-aws-recommender:latest
    profiles: [graph]
    command: [python, local_runner.py, gateway]
    env_file:
      - path: recommender/.env
        required: false
    environment: *queue
    volumes:
      - ./recommender:/app:ro
    depends_on:
      - sqs

volumes:
  postgres-data:
  sqs-data:
  garage_data:
  garage_meta:

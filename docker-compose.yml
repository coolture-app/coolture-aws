services:
  postgres:
    build: ./db
    platform: linux/amd64
    image: coolture-aws-postgres:latest
    container_name: coolture-postgres
    ports:
      - "5430:5432"
    environment:
      POSTGRES_DB: coolture
      POSTGRES_USER: coolture_admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolture_admin -d coolture"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:


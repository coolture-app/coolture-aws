AWSTemplateFormatVersion: '2010-09-09'
Description: Coolture WAF (CloudFront scope, must be deployed in us-east-1)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  RateLimitPer5Minutes:
    Type: Number
    Default: 2000
    MinValue: 10

Resources:
  AllowedIpv4Set:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: !Sub 'coolture-${Environment}-allowed-ipv4'
      Scope: CLOUDFRONT
      IPAddressVersion: IPV4
      Addresses: []

  AllowedIpv6Set:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: !Sub 'coolture-${Environment}-allowed-ipv6'
      Scope: CLOUDFRONT
      IPAddressVersion: IPV6
      Addresses: []

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'coolture-${Environment}'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'coolture-${Environment}'
      Rules:
        - Name: block-unlisted-ips
          Priority: 0
          Action:
            Block: {}
          Statement:
            NotStatement:
              Statement:
                OrStatement:
                  Statements:
                    - IPSetReferenceStatement:
                        Arn: !GetAtt AllowedIpv4Set.Arn
                    - IPSetReferenceStatement:
                        Arn: !GetAtt AllowedIpv6Set.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'coolture-${Environment}-unlisted-ip'
        - Name: rate-limit-per-ip
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Minutes
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'coolture-${Environment}-rate-limit'
        - Name: aws-ip-reputation
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'coolture-${Environment}-ip-reputation'

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn

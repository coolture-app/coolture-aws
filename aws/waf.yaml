AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Coolture WAF - CloudFront-scoped web ACL protecting the whole distribution (SSR, static assets and /api/*).
  CloudFront web ACLs must live in us-east-1. Pay-as-you-go: $5/month per web ACL + $1/month per rule
  + $0.60 per 1M requests inspected.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  RateLimitPer5Minutes:
    Type: Number
    Default: 2000
    MinValue: 10
    Description: Requests one IP may send in any 5-minute window before it is blocked (page loads, assets and API calls all count)

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'coolture-${Environment}'
      Description: Per-IP rate limiting and AWS IP reputation list for the Coolture CloudFront distribution
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'coolture-${Environment}'
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Minutes
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'coolture-${Environment}-rate-limit'
        - Name: aws-ip-reputation
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'coolture-${Environment}-ip-reputation'

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coolture Frontend

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  BackendStackName:
    Type: String
    Default: coolture-backend-dev
  LambdaWebAdapterLayerVersion:
    Type: Number
    Default: 30
  LogRetentionDays:
    Type: Number
    Default: 7
  WebAclArn:
    Type: String
    Default: ''
  GeocoderStackName:
    Type: String
    Default: ''
    Description: The geocoder stack whose VPC origin serves /geo. Empty leaves /geo out

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, '']]
  HasGeocoder: !Not [!Equals [!Ref GeocoderStackName, '']]

Resources:
  SSRLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-ssr'
      RetentionInDays: !Ref LogRetentionDays

  SSRFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-ssr'
      CodeUri: lambdas/ssr/
      Handler: run.sh
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 30
      Layers:
        - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:${LambdaWebAdapterLayerVersion}'
      LoggingConfig:
        LogGroup: !Ref SSRLogGroup
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_READINESS_CHECK_PROTOCOL: tcp
          PORT: '8080'
          NODE_ENV: production
          NG_ALLOWED_HOSTS: !Sub '*.cloudfront.net,*.lambda-url.${AWS::Region}.on.aws'
          ORIGIN_VERIFY_SECRET: !Sub '{{resolve:secretsmanager:coolture-${Environment}-origin-verify:SecretString}}'
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Tags:
        Project: coolture
        Environment: !Ref Environment
    Metadata:
      BuildMethod: makefile

  SSRFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SSRFunction
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  SSRFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SSRFunction
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  StaticAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'coolture-${Environment}-static-assets'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  StaticAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticAssetsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${StaticAssetsBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  S3OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'coolture-${Environment}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'coolture-${Environment}-lambda-oac'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'coolture-${Environment}-viewer-request'
      AutoPublish: true
      FunctionConfig:
        Comment: Strip /api or /geo, pass the viewer host to SSR
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (/^\/(api|geo)(\/|$)/.test(request.uri)) {
            request.uri = request.uri.substring(4) || '/';
          } else if (request.headers.host) {
            request.headers['x-forwarded-host'] = { value: request.headers.host.value };
          }
          return request;
        }

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'coolture-${Environment}-api'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  # Query strings only: cookies and headers would split the cache per user and reach Photon for nothing.
  GeocoderCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: HasGeocoder
    Properties:
      CachePolicyConfig:
        Name: !Sub 'coolture-${Environment}-geocoder'
        MinTTL: 0
        DefaultTTL: 3600
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'coolture-${Environment}'
        HttpVersion: http2and3
        IPV6Enabled: true
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-assets
            DomainName: !GetAtt StaticAssetsBucket.RegionalDomainName
            OriginAccessControlId: !Ref S3OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: lambda-ssr
            DomainName: !Select [2, !Split ['/', !GetAtt SSRFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !Ref LambdaOriginAccessControl
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: http-api
            DomainName:
              Fn::ImportValue: !Sub '${BackendStackName}-ApiDomain'
            OriginPath: !Sub '/${Environment}'
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub '{{resolve:secretsmanager:coolture-${Environment}-origin-verify:SecretString}}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - !If
            - HasGeocoder
            - Id: geocoder
              DomainName: !ImportValue {'Fn::Sub': '${GeocoderStackName}-InstancePrivateDnsName'}
              VpcOriginConfig:
                VpcOriginId: !ImportValue {'Fn::Sub': '${GeocoderStackName}-VpcOriginId'}
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: lambda-ssr
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: http-api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
          # Photon's answers say Cache-Control max-age=3600, so the same text typed twice reaches it once an hour.
          - !If
            - HasGeocoder
            - PathPattern: /geo/*
              TargetOriginId: geocoder
              ViewerProtocolPolicy: https-only
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachePolicyId: !Ref GeocoderCachePolicy
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue
          - {PathPattern: '*.js', TargetOriginId: s3-assets, ViewerProtocolPolicy: redirect-to-https, Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6, ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03}
          - {PathPattern: '*.css', TargetOriginId: s3-assets, ViewerProtocolPolicy: redirect-to-https, Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6, ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03}
          - {PathPattern: /media/*, TargetOriginId: s3-assets, ViewerProtocolPolicy: redirect-to-https, Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6, ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03}
          - {PathPattern: /i18n/*, TargetOriginId: s3-assets, ViewerProtocolPolicy: redirect-to-https, Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6, ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03}
          - {PathPattern: /favicon.ico, TargetOriginId: s3-assets, ViewerProtocolPolicy: redirect-to-https, Compress: true, CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6, ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03}

Outputs:
  StaticAssetsBucketName:
    Value: !Ref StaticAssetsBucket
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  WebsiteUrl:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

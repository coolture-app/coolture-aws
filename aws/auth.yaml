AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coolture Auth

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  FrontendUrl:
    Type: String
    Default: ''
  LogRetentionDays:
    Type: Number
    Default: 7

Conditions:
  HasFrontendUrl: !Not [!Equals [!Ref FrontendUrl, '']]

Globals:
  Function:
    CodeUri: lambdas/authorizer/src/
    Handler: app.lambda_handler
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 5
    Environment:
      Variables:
        COGNITO_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        ORIGIN_VERIFY_SECRET: !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString}}'
    Tags:
      Project: coolture
      Environment: !Ref Environment

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'coolture-${Environment}'
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'coolture-${Environment}-client'
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs: [!If [HasFrontendUrl, !Sub '${FrontendUrl}/auth/callback', 'https://frontend-not-deployed.invalid/auth/callback']]
      LogoutURLs: [!If [HasFrontendUrl, !Sub '${FrontendUrl}/', 'https://frontend-not-deployed.invalid/']]
      SupportedIdentityProviders: [COGNITO]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'coolture-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'coolture-${Environment}-origin-verify'
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  OptionalAuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-optional-auth'
      RetentionInDays: !Ref LogRetentionDays

  OptionalAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-optional-auth'
      LoggingConfig:
        LogGroup: !Ref OptionalAuthLogGroup
      Environment:
        Variables:
          AUTH_MODE: optional

  RequiredAuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-required-auth'
      RetentionInDays: !Ref LogRetentionDays

  RequiredAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-required-auth'
      LoggingConfig:
        LogGroup: !Ref RequiredAuthLogGroup
      Environment:
        Variables:
          AUTH_MODE: required

Outputs:
  UserPoolClientId:
    Value: !Ref UserPoolClient
  HostedUiUrl:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  OptionalAuthFunctionArn:
    Value: !GetAtt OptionalAuthFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OptionalAuthFunctionArn'
  RequiredAuthFunctionArn:
    Value: !GetAtt RequiredAuthFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RequiredAuthFunctionArn'

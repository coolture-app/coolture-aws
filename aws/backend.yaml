AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coolture Backend

Parameters:
  Environment:
    Type: String
    Default: local
    AllowedValues: [local, dev, staging, prod]
  BaseStackName:
    Type: String
    Default: coolture-base-dev
    Description: Network stack (aws/base.yaml) whose VPC, subnets and security groups are imported
  DbName:
    Type: String
    Default: coolture
  DbUsername:
    Type: String
    Default: coolture_admin
  DbPassword:
    Type: String
    Default: admin
    NoEcho: true
  DbHost:
    Type: String
    Default: host.docker.internal
  DbPort:
    Type: String
    Default: '5430'

Conditions:
  IsAWS: !Not [!Equals [!Ref Environment, 'local']]

Globals:
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_HOST: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Address, !Ref DbHost]
        DB_PORT: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Port, !Ref DbPort]
        DB_NAME: !Ref DbName
        DB_USERNAME: !Ref DbUsername
        DB_PASSWORD: !Ref DbPassword
    Tags:
      Project: coolture
      Environment: !Ref Environment
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowMethods: "'*'"
      AllowHeaders: "'*'"

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsAWS
    Properties:
      Name: !Sub 'coolture-${Environment}-db-credentials'
      SecretString: !Sub |
        {
          "username": "${DbUsername}",
          "password": "${DbPassword}",
          "engine": "postgres",
          "host": "${AuroraCluster.Endpoint.Address}",
          "port": ${AuroraCluster.Endpoint.Port},
          "dbname": "${DbName}"
        }

  AuroraSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: IsAWS
    Properties:
      DBSubnetGroupName: !Sub 'coolture-${Environment}-subnet-group'
      DBSubnetGroupDescription: Private subnets from the base stack
      SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Condition: IsAWS
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '15.4'
      DatabaseName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBClusterIdentifier: !Sub 'coolture-${Environment}-cluster'
      DBSubnetGroupName: !Ref AuroraSubnetGroup
      VpcSecurityGroupIds:
        - !ImportValue {'Fn::Sub': '${BaseStackName}-DatabaseSecurityGroupId'}
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1.0
      BackupRetentionPeriod: 7
      StorageEncrypted: true

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Condition: IsAWS
    Properties:
      DBInstanceIdentifier: !Sub 'coolture-${Environment}-instance-1'
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsAWS
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !ImportValue {'Fn::Sub': '${BaseStackName}-VpcId'}
      RouteTableIds:
        - !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateRouteTableId'}

  PostEmbeddingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'coolture-${Environment}-post-embedding-dlq'
      MessageRetentionPeriod: 1209600

  PostEmbeddingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'coolture-${Environment}-post-embedding'
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PostEmbeddingDLQ.Arn
        maxReceiveCount: 3

  PostEmbeddingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PostEmbeddingQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PostEmbeddingQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::coolture-${Environment}-embedding-requests-${AWS::AccountId}'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EmbeddingRequestsBucket:
    Type: AWS::S3::Bucket
    DependsOn: PostEmbeddingQueuePolicy
    Properties:
      BucketName: !Sub 'coolture-${Environment}-embedding-requests-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEmbeddingRequests
            Status: Enabled
            Prefix: posts/
            ExpirationInDays: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt PostEmbeddingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: posts/


# Lambda Functions
  UsersListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-users-list'
      CodeUri: lambdas/users-list/
      Handler: com.coolture.UsersListHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BaseStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        GetUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: GET

  UserCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-user-create'
      CodeUri: lambdas/user-create/
      Handler: com.coolture.UserCreateHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BaseStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        CreateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: POST

  PostWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-write'
      CodeUri: lambdas/post-write/
      Handler: com.coolture.PostWriteHandler::handleRequest
      MemorySize: 1024
      Environment:
        Variables:
          EMBEDDING_REQUESTS_BUCKET: !If [IsAWS, !Ref EmbeddingRequestsBucket, '']
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${EmbeddingRequestsBucket.Arn}/posts/*'
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BaseStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        CreatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts
            Method: POST
        UpdatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{id}
            Method: PATCH
        DeletePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{id}
            Method: DELETE
        CreateEventLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations
            Method: POST
        UpdateEventLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/{id}
            Method: PATCH
        DeleteEventLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/{id}
            Method: DELETE
        CreateEventLocationAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin
            Method: POST
        UpdateEventLocationAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin/{id}
            Method: PATCH
        DeleteEventLocationAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin/{id}
            Method: DELETE

  PostReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-read'
      CodeUri: lambdas/post-read/
      Handler: com.coolture.PostReadHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BaseStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        GetRecommendations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/recommendations
            Method: GET
        GetMapMarks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/map
            Method: GET
        GetPostById:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{id}
            Method: GET
        GetFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts
            Method: GET
        GetEventLocations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations
            Method: GET
        GetEventLocationsAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin
            Method: GET

  CommentReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-comment-read'
      CodeUri: lambdas/comment-read/
      Handler: com.coolture.CommentReadHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BaseStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        ListComments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/comments
            Method: GET

  CommentWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-comment-write'
      CodeUri: lambdas/comment-write/
      Handler: com.coolture.CommentWriteHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
          SecurityGroupIds:
            - !ImportValue {'Fn::Sub': '${BaseStackName}-LambdaSecurityGroupId'}
        - !Ref AWS::NoValue
      Events:
        CreateComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/comments
            Method: POST
        UpdateComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /comments/{commentId}
            Method: PATCH
        DeleteComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /comments/{commentId}
            Method: DELETE

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'
  DbEndpoint:
    Value: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Address, 'localhost']
    Export:
      Name: !Sub '${AWS::StackName}-DbEndpoint'
  DbPort:
    Value: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Port, !Ref DbPort]
    Export:
      Name: !Sub '${AWS::StackName}-DbPort'
  PostEmbeddingQueueArn:
    Value: !GetAtt PostEmbeddingQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PostEmbeddingQueueArn'

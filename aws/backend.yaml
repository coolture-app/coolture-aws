AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coolture Backend

Parameters:
  Environment:
    Type: String
    Default: local
    AllowedValues: [local, dev, staging, prod]
  BaseStackName:
    Type: String
    Default: mgmt-stack-networking
  DbName:
    Type: String
    Default: coolture
  DbUsername:
    Type: String
    Default: coolture_admin
  DbPassword:
    Type: String
    Default: admin
    NoEcho: true
  DbAppUsername:
    Type: String
    Default: coolture_app
  DbHost:
    Type: String
    Default: host.docker.internal
  DbPort:
    Type: String
    Default: '5430'
  AuthStackName:
    Type: String
    Default: 'coolture-auth-dev'
  GarageAccessKeyId:
    Type: String
    Default: ''
    NoEcho: true
  GarageAccessKeySecret:
    Type: String
    Default: ''
    NoEcho: true
  AuroraEngineVersion:
    Type: String
    Default: '16.8'
  CorsAllowedOrigins:
    Type: String
    Default: 'http://localhost:4200'
  ApiThrottlingRateLimit:
    Type: Number
    Default: 20
  ApiThrottlingBurstLimit:
    Type: Number
    Default: 40
  LogRetentionDays:
    Type: Number
    Default: 7

Conditions:
  IsAWS: !Not [!Equals [!Ref Environment, 'local']]

Globals:
  Function:
    Runtime: java21
    Architectures: !If [IsAWS, [arm64], [x86_64]]
    MemorySize: 512
    Timeout: 30
    VpcConfig: !If
      - IsAWS
      - SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      - !Ref AWS::NoValue
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_HOST: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Address, !Ref DbHost]
        DB_PORT: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Port, !Ref DbPort]
        DB_NAME: !Ref DbName
        DB_USERNAME: !If [IsAWS, !Ref DbAppUsername, !Ref DbUsername]
        DB_PASSWORD: !If [IsAWS, '', !Ref DbPassword]
        DB_IAM_AUTH: !If [IsAWS, 'true', 'false']
        DB_CONNECTION_TIMEOUT_MS: !If [IsAWS, '25000', '5000']
        MEDIA_BUCKET_NAME: !If [IsAWS, !Ref MediaBucket, 'coolture-bucket']
        S3_ENDPOINT_URL: !If [IsAWS, '', 'http://host.docker.internal:3900']
        S3_PUBLIC_ENDPOINT_URL: !If [IsAWS, '', 'http://localhost:3900']
        GARAGE_ACCESS_KEY_ID: !If [IsAWS, '', !Ref GarageAccessKeyId]
        GARAGE_ACCESS_KEY_SECRET: !If [IsAWS, '', !Ref GarageAccessKeySecret]
        S3_REGION: !If [IsAWS, '', 'garage']
    Tags:
      Project: coolture
      Environment: !Ref Environment

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsAWS
    Properties:
      Name: !Sub 'coolture-${Environment}-db-credentials'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'' '

  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Condition: IsAWS
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref AuroraCluster
      TargetType: AWS::RDS::DBCluster

  DbConnectPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsAWS
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${AuroraCluster.DBClusterResourceId}/${DbAppUsername}'

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsAWS
    Properties:
      GroupName: !Sub 'coolture-${Environment}-lambda-sg'
      GroupDescription: VPC-attached Coolture Lambdas
      VpcId: !ImportValue {'Fn::Sub': '${BaseStackName}-VpcId'}
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsAWS
    Properties:
      GroupName: !Sub 'coolture-${Environment}-database-sg'
      GroupDescription: Aurora PostgreSQL, reachable only from the Lambda security group
      VpcId: !ImportValue {'Fn::Sub': '${BaseStackName}-VpcId'}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  AuroraSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: IsAWS
    Properties:
      DBSubnetGroupName: !Sub 'coolture-${Environment}-subnet-group'
      DBSubnetGroupDescription: Private subnets from the base stack
      SubnetIds: !Split [',', !ImportValue {'Fn::Sub': '${BaseStackName}-PrivateSubnetIds'}]

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Condition: IsAWS
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      DatabaseName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      EnableIAMDatabaseAuthentication: true
      DBClusterIdentifier: !Sub 'coolture-${Environment}-cluster'
      DBSubnetGroupName: !Ref AuroraSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: 1.0
        SecondsUntilAutoPause: 300
      BackupRetentionPeriod: 7
      StorageEncrypted: true

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Condition: IsAWS
    Properties:
      DBInstanceIdentifier: !Sub 'coolture-${Environment}-instance-1'
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsAWS
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-db-migrations'
      RetentionInDays: !Ref LogRetentionDays

  MigrationFunction:
    Type: AWS::Serverless::Function
    Condition: IsAWS
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-db-migrations'
      LoggingConfig:
        LogGroup: !Ref MigrationLogGroup
      CodeUri: lambdas/migrations/src/
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 600
      AutoPublishAlias: live
      Environment:
        Variables:
          DB_USERNAME: !Ref DbUsername
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
          DB_IAM_AUTH: 'false'
          DB_CONNECT_TIMEOUT_SECONDS: '30'

  DatabaseMigrations:
    Type: AWS::CloudFormation::CustomResource
    Condition: IsAWS
    DependsOn: AuroraInstance
    Properties:
      ServiceToken: !Ref MigrationFunction.Alias
      ServiceTimeout: 900
      CodeVersion: !Ref MigrationFunction.Version

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref CorsAllowedOrigins]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        AllowCredentials: true
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit
      Auth:
        DefaultAuthorizer: RequiredAuthorizer
        Authorizers:
          RequiredAuthorizer:
            FunctionArn:
              Fn::ImportValue: !Sub '${AuthStackName}-RequiredAuthFunctionArn'
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers: [Authorization, X-Origin-Verify]
              ReauthorizeEvery: 300
          OptionalAuthorizer:
            FunctionArn:
              Fn::ImportValue: !Sub '${AuthStackName}-OptionalAuthFunctionArn'
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            Identity:
              ReauthorizeEvery: 0

  PostEmbeddingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'coolture-${Environment}-post-embedding-dlq'
      MessageRetentionPeriod: 1209600

  PostEmbeddingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'coolture-${Environment}-post-embedding'
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PostEmbeddingDLQ.Arn
        maxReceiveCount: 3

  PostEmbeddingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PostEmbeddingQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PostEmbeddingQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::coolture-${Environment}-embedding-requests-${AWS::AccountId}'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EmbeddingRequestsBucket:
    Type: AWS::S3::Bucket
    DependsOn: PostEmbeddingQueuePolicy
    Properties:
      BucketName: !Sub 'coolture-${Environment}-embedding-requests-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEmbeddingRequests
            Status: Enabled
            Prefix: posts/
            ExpirationInDays: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt PostEmbeddingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: posts/

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'coolture-${Environment}-media'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, HEAD, DELETE]
            AllowedOrigins: ['*']
            MaxAge: 3600

  UserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-user'
      RetentionInDays: !Ref LogRetentionDays

  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-user'
      LoggingConfig:
        LogGroup: !Ref UserLogGroup
      CodeUri: lambdas/user/
      Handler: com.coolture.user.UserHandler::handleRequest
      Policies:
        - !If [IsAWS, !Ref DbConnectPolicy, !Ref AWS::NoValue]
        - S3ReadPolicy:
            BucketName: !Ref MediaBucket
      Events:
        SearchUsers: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /users, Method: GET}}
        GetUserById: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}', Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetUserByUsername: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/by-username/{username}', Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        UpdateUser: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}', Method: PATCH}}
        SetProfileImage: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/profile-image', Method: PUT}}
        DeleteProfileImage: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/profile-image', Method: DELETE}}
        GetMe: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /auth/me, Method: GET}}
        GetFollowers: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/followers', Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetFollowing: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/following', Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        FollowUser: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/follow', Method: POST}}
        UnfollowUser: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/follow', Method: DELETE}}
        GetBlocking: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/blocking', Method: GET}}
        BlockUser: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/block', Method: POST}}
        UnblockUser: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/users/{userId}/block', Method: DELETE}}

  PostWriteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-post-write'
      RetentionInDays: !Ref LogRetentionDays

  PostWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-write'
      LoggingConfig:
        LogGroup: !Ref PostWriteLogGroup
      CodeUri: lambdas/post-write/
      Handler: com.coolture.PostWriteHandler::handleRequest
      MemorySize: 1024
      Environment:
        Variables:
          EMBEDDING_REQUESTS_BUCKET: !If [IsAWS, !Ref EmbeddingRequestsBucket, '']
      Policies:
        - !If [IsAWS, !Ref DbConnectPolicy, !Ref AWS::NoValue]
        - S3ReadPolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${EmbeddingRequestsBucket.Arn}/posts/*'
      Events:
        CreatePost: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /posts, Method: POST}}
        UpdatePost: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{id}', Method: PATCH}}
        DeletePost: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{id}', Method: DELETE}}
        CreateEventLocation: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /event-locations, Method: POST}}
        UpdateEventLocation: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/event-locations/{id}', Method: PATCH}}
        DeleteEventLocation: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/event-locations/{id}', Method: DELETE}}
        CreateEventLocationAdmin: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /event-locations/admin, Method: POST}}
        UpdateEventLocationAdmin: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/event-locations/admin/{id}', Method: PATCH}}
        DeleteEventLocationAdmin: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/event-locations/admin/{id}', Method: DELETE}}
        UpsertReaction: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{postId}/reaction', Method: PUT}}
        DeleteReaction: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{postId}/reaction', Method: DELETE}}
        UpsertParticipation: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{postId}/participation', Method: PUT}}
        DeleteParticipation: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{postId}/participation', Method: DELETE}}
        CreateCountryCode: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /dicts/admin/country-codes, Method: POST}}
        UpdateCountryCode: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/dicts/admin/country-codes/{code}', Method: PUT}}
        DeleteCountryCode: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/dicts/admin/country-codes/{code}', Method: DELETE}}

  PostReadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-post-read'
      RetentionInDays: !Ref LogRetentionDays

  PostReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-read'
      LoggingConfig:
        LogGroup: !Ref PostReadLogGroup
      CodeUri: lambdas/post-read/
      Handler: com.coolture.PostReadHandler::handleRequest
      MemorySize: 1024
      Policies:
        - !If [IsAWS, !Ref DbConnectPolicy, !Ref AWS::NoValue]
        - S3ReadPolicy:
            BucketName: !Ref MediaBucket
      Events:
        HealthCheck: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /actuator/health, Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetCountryCodes: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /dicts/country-codes, Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetRecommendations: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /posts/recommendations, Method: GET}}
        GetMapMarks: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /posts/map, Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetPostById: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{id}', Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetFeed: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /posts, Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetEventLocations: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /event-locations, Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        GetEventLocationsAdmin: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /event-locations/admin, Method: GET}}

  CommentReadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-comment-read'
      RetentionInDays: !Ref LogRetentionDays

  CommentReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-comment-read'
      LoggingConfig:
        LogGroup: !Ref CommentReadLogGroup
      CodeUri: lambdas/comment-read/
      Handler: com.coolture.CommentReadHandler::handleRequest
      MemorySize: 1024
      Policies:
        - !If [IsAWS, !Ref DbConnectPolicy, !Ref AWS::NoValue]
        - S3ReadPolicy:
            BucketName: !Ref MediaBucket
      Events:
        ListComments: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{postId}/comments', Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}

  CommentWriteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-comment-write'
      RetentionInDays: !Ref LogRetentionDays

  CommentWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-comment-write'
      LoggingConfig:
        LogGroup: !Ref CommentWriteLogGroup
      CodeUri: lambdas/comment-write/
      Handler: com.coolture.CommentWriteHandler::handleRequest
      MemorySize: 1024
      Policies:
        - !If [IsAWS, !Ref DbConnectPolicy, !Ref AWS::NoValue]
        - S3ReadPolicy:
            BucketName: !Ref MediaBucket
      Events:
        CreateComment: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/posts/{postId}/comments', Method: POST}}
        UpdateComment: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/comments/{commentId}', Method: PATCH}}
        DeleteComment: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/comments/{commentId}', Method: DELETE}}

  MediaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/coolture-${Environment}-media'
      RetentionInDays: !Ref LogRetentionDays

  MediaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-media'
      LoggingConfig:
        LogGroup: !Ref MediaLogGroup
      CodeUri: lambdas/media/
      Handler: com.coolture.media.MediaHandler::handleRequest
      Policies:
        - !If [IsAWS, !Ref DbConnectPolicy, !Ref AWS::NoValue]
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      Events:
        InitUpload: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /media/uploads/init, Method: POST}}
        CompleteUpload: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/media/uploads/{mediaId}/complete', Method: POST}}
        GetMedia: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/media/{mediaId}', Method: GET, Auth: {Authorizer: OptionalAuthorizer}}}
        DeleteMedia: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/media/{mediaId}', Method: DELETE}}

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/'
  ApiDomain:
    Value: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiDomain'
  DbEndpoint:
    Value: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Address, 'localhost']
    Export:
      Name: !Sub '${AWS::StackName}-DbEndpoint'
  DbPort:
    Value: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Port, !Ref DbPort]
    Export:
      Name: !Sub '${AWS::StackName}-DbPort'
  DbConnectPolicyArn:
    Condition: IsAWS
    Value: !Ref DbConnectPolicy
    Export:
      Name: !Sub '${AWS::StackName}-DbConnectPolicyArn'
  DbSecretArn:
    Condition: IsAWS
    Value: !Ref DbSecret
  LambdaSecurityGroupId:
    Condition: IsAWS
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-LambdaSecurityGroupId'
  PostEmbeddingQueueArn:
    Value: !GetAtt PostEmbeddingQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PostEmbeddingQueueArn'

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Coolture Backend

Parameters:
  Environment:
    Type: String
    Default: local
    AllowedValues: [local, dev, staging, prod]
  VpcId:
    Type: String
    Default: ''
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ''
  DbName:
    Type: String
    Default: coolture
  DbUsername:
    Type: String
    Default: coolture_admin
  DbPassword:
    Type: String
    Default: admin
    NoEcho: true
  DbHost:
    Type: String
    Default: host.docker.internal
  DbPort:
    Type: String
    Default: '5430'
  AuthStackName:
    Type: String
    Default: 'coolture-auth-dev'
  GarageAccessKeyId:
    Type: String
    Default: ''
    NoEcho: true
  GarageAccessKeySecret:
    Type: String
    Default: ''
    NoEcho: true

Conditions:
  IsAWS: !Not [!Equals [!Ref Environment, 'local']]

Globals:
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_HOST: !Ref DbHost # TODO: change to aurora cluster endpoint when not local
        DB_PORT: !Ref DbPort # TODO: change to aurora port when not local
        DB_NAME: !Ref DbName
        DB_USERNAME: !Ref DbUsername
        DB_PASSWORD: !Ref DbPassword
        MEDIA_BUCKET_NAME: !If [IsAWS, !Sub 'coolture-${Environment}-media', 'coolture-bucket']
        S3_ENDPOINT_URL: !If [IsAWS, '', 'http://host.docker.internal:3900']
        S3_PUBLIC_ENDPOINT_URL: !If [IsAWS, '', 'http://localhost:3900']
        GARAGE_ACCESS_KEY_ID: !If [IsAWS, '', !Ref GarageAccessKeyId]
        GARAGE_ACCESS_KEY_SECRET: !If [IsAWS, '', !Ref GarageAccessKeySecret]
        S3_REGION: !If [IsAWS, '', 'garage']
    Tags:
      Project: coolture
      Environment: !Ref Environment
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowMethods: "'*'"
      AllowHeaders: "'*'"

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsAWS
    Properties:
      Name: !Sub 'coolture-${Environment}-db-credentials'
      SecretString: !Sub |
        {
          "username": "${DbUsername}",
          "password": "${DbPassword}",
          "engine": "postgres",
          "host": "${AuroraCluster.Endpoint.Address}",
          "port": ${AuroraCluster.Endpoint.Port},
          "dbname": "${DbName}"
        }

  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsAWS
    Properties:
      GroupName: !Sub 'coolture-${Environment}-aurora-sg'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  AuroraSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: IsAWS
    Properties:
      DBSubnetGroupName: !Sub 'coolture-${Environment}-subnet-group'
      SubnetIds: !Ref PrivateSubnetIds

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Condition: IsAWS
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '15.4'
      DatabaseName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBClusterIdentifier: !Sub 'coolture-${Environment}-cluster'
      DBSubnetGroupName: !If [IsAWS, !Ref AuroraSubnetGroup, !Ref AWS::NoValue]
      VpcSecurityGroupIds: !If [IsAWS, [!Ref AuroraSecurityGroup], !Ref AWS::NoValue]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1.0
      BackupRetentionPeriod: 7
      StorageEncrypted: true

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Condition: IsAWS
    Properties:
      DBInstanceIdentifier: !Sub 'coolture-${Environment}-instance-1'
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              Audience:
                - Fn::ImportValue: !Sub '${AuthStackName}-ClientId'
              Issuer:
                Fn::ImportValue: !Sub '${AuthStackName}-Issuer'

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsAWS
    Properties:
      GroupName: !Sub 'coolture-${Environment}-lambda-sg'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Lambda Functions
  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-user'
      CodeUri: lambdas/user/
      Handler: com.coolture.user.UserHandler::handleRequest
      MemorySize: 512
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds: [!Ref LambdaSecurityGroup]
        - !Ref AWS::NoValue
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'coolture-${Environment}-media'
      Events:
        SearchUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: GET
        CreateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: POST
        GetUserById:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}
            Method: GET
            Auth:
              Authorizer: NONE # TODO: needs optional-auth Lambda authorizer so logged-in users get isFollowing/isBlocked
        GetUserByUsername:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/by-username/{username}
            Method: GET
            Auth:
              Authorizer: NONE # TODO: needs optional-auth Lambda authorizer
        UpdateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}
            Method: PATCH
        SetProfileImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/profile-image
            Method: PUT
        DeleteProfileImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/profile-image
            Method: DELETE
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /auth/me
            Method: GET
        GetFollowers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/followers
            Method: GET
            Auth:
              Authorizer: NONE
        GetFollowing:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/following
            Method: GET
            Auth:
              Authorizer: NONE
        FollowUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/follow
            Method: POST
        UnfollowUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/follow
            Method: DELETE
        GetBlocking:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/blocking
            Method: GET
        BlockUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/block
            Method: POST
        UnblockUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{userId}/block
            Method: DELETE

  PostWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-write'
      CodeUri: lambdas/post-write/
      Handler: com.coolture.PostWriteHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds: [!Ref LambdaSecurityGroup]
        - !Ref AWS::NoValue
      Events:
        CreatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts
            Method: POST
        UpdatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{id}
            Method: PATCH
        DeletePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{id}
            Method: DELETE
        CreateEventLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations
            Method: POST
        UpdateEventLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/{id}
            Method: PATCH
        DeleteEventLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/{id}
            Method: DELETE
        CreateEventLocationAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin
            Method: POST
        UpdateEventLocationAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin/{id}
            Method: PATCH
        DeleteEventLocationAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin/{id}
            Method: DELETE
        UpsertReaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/reaction
            Method: PUT
        DeleteReaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/reaction
            Method: DELETE
        UpsertParticipation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/participation
            Method: PUT
        DeleteParticipation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/participation
            Method: DELETE
        CreateCountryCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dicts/admin/country-codes
            Method: POST
        UpdateCountryCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dicts/admin/country-codes/{code}
            Method: PUT
        DeleteCountryCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dicts/admin/country-codes/{code}
            Method: DELETE

  PostReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-post-read'
      CodeUri: lambdas/post-read/
      Handler: com.coolture.PostReadHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds: [!Ref LambdaSecurityGroup]
        - !Ref AWS::NoValue
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /actuator/health
            Method: GET
            Auth:
              Authorizer: NONE
        GetCountryCodes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dicts/country-codes
            Method: GET
            Auth:
              Authorizer: NONE
        GetRecommendations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/recommendations
            Method: GET
        GetMapMarks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/map
            Method: GET
            Auth:
              Authorizer: NONE # TODO: needs optional-auth Lambda authorizer for myReaction/myParticipation
        GetPostById:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{id}
            Method: GET
            Auth:
              Authorizer: NONE # TODO: needs optional-auth Lambda authorizer for myReaction/myParticipation
        GetFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts
            Method: GET
            Auth:
              Authorizer: NONE # TODO: needs optional-auth Lambda authorizer for participation/reaction filters
        GetEventLocations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations
            Method: GET
            Auth:
              Authorizer: NONE
        GetEventLocationsAdmin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /event-locations/admin
            Method: GET

  CommentReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-comment-read'
      CodeUri: lambdas/comment-read/
      Handler: com.coolture.CommentReadHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds: [!Ref LambdaSecurityGroup]
        - !Ref AWS::NoValue
      Events:
        ListComments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/comments
            Method: GET
            Auth:
              Authorizer: NONE

  CommentWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-comment-write'
      CodeUri: lambdas/comment-write/
      Handler: com.coolture.CommentWriteHandler::handleRequest
      MemorySize: 1024
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds: [!Ref LambdaSecurityGroup]
        - !Ref AWS::NoValue
      Events:
        CreateComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/comments
            Method: POST
        UpdateComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /comments/{commentId}
            Method: PATCH
        DeleteComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /comments/{commentId}
            Method: DELETE

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'coolture-${Environment}-media'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, HEAD, DELETE]
            AllowedOrigins: ['*']
            MaxAge: 3600

  MediaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'coolture-${Environment}-media'
      CodeUri: lambdas/media/
      Handler: com.coolture.media.MediaHandler::handleRequest
      MemorySize: 512
      VpcConfig: !If
        - IsAWS
        - SubnetIds: !Ref PrivateSubnetIds
          SecurityGroupIds: [!Ref LambdaSecurityGroup]
        - !Ref AWS::NoValue
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub 'coolture-${Environment}-media'
      Events:
        InitUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /media/uploads/init
            Method: POST
        CompleteUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /media/uploads/{mediaId}/complete
            Method: POST
        GetMedia:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /media/{mediaId}
            Method: GET
            Auth:
              Authorizer: NONE
        DeleteMedia:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /media/{mediaId}
            Method: DELETE

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'
  DbEndpoint:
    Value: !If [IsAWS, !GetAtt AuroraCluster.Endpoint.Address, 'localhost']
    Export:
      Name: !Sub '${AWS::StackName}-DbEndpoint'

AWSTemplateFormatVersion: '2010-09-09'
Description: Coolture scraper - what scraper/remote.py uses to import trojmiasto.pl events from outside AWS, as the bot

# trojmiasto.pl's Cloudflare challenges every request from AWS, so the scraper runs on a computer outside it, through
# RunnerRole. The bot's password and the runner user's access key are set by hand: scraper/README.md, "On an always-on
# computer".

# remote.py reads every setting from this stack's outputs, so two of them pass on other stacks' exports.
Metadata:
  cfn-lint:
    config:
      ignore_checks: [W6001]

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  BackendStackName:
    Type: String
    Default: coolture-backend-dev
  GeocoderStackName:
    Type: String
    Default: coolture-geocoder-dev
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  DeveloperRoleName:
    Type: String
    Default: developer
    Description: The team's role, which may also assume RunnerRole, so anyone can run make scrape-aws

Resources:
  LedgerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'coolture-${Environment}-scraper-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Created empty: the bot's password is set by hand, as {"username": "...", "password": "..."}.
  BotSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'coolture-${Environment}-scraper-bot'
      Description: The scraper bot's Cognito username and permanent password

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/coolture/${Environment}/scraper'
      RetentionInDays: 30

  # The always-on computer's identity. Its access key is made by hand, so it never sits in the stack.
  RunnerUser:
    Type: AWS::IAM::User

  RunnerUserMayAssumeTheRole:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: assume-scraper-runner
      Users: [!Ref RunnerUser]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt RunnerRole.Arn

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !GetAtt RunnerUser.Arn
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeveloperRoleName}'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scrape
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref BotSecret
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:coolture-${Environment}-origin-verify-*'
              - Effect: Allow
                Action: cognito-idp:AdminInitiateAuth
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${LedgerBucket.Arn}/*'
              # Without it a missing ledger reads as 403 instead of NoSuchKey.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt LedgerBucket.Arn
              - Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource: !ImportValue {'Fn::Sub': '${GeocoderStackName}-ProxyFunctionArn'}
                Condition:
                  StringEquals:
                    lambda:FunctionUrlAuthType: AWS_IAM
              # Function URLs made since October 2025 need this too.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !ImportValue {'Fn::Sub': '${GeocoderStackName}-ProxyFunctionArn'}
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn

# remote.py reads its settings from these.
Outputs:
  ApiUrl:
    Value: !Sub
      - 'https://${Domain}/${Environment}'
      - Domain: !ImportValue {'Fn::Sub': '${BackendStackName}-ApiDomain'}
  GeocoderUrl:
    Value: !ImportValue {'Fn::Sub': '${GeocoderStackName}-ProxyUrl'}
  BotSecretArn:
    Value: !Ref BotSecret
  OriginVerifySecretName:
    Value: !Sub 'coolture-${Environment}-origin-verify'
  UserPoolId:
    Value: !Ref UserPoolId
  UserPoolClientId:
    Value: !Ref UserPoolClientId
  LedgerBucket:
    Value: !Ref LedgerBucket
  LogGroup:
    Value: !Ref LogGroup
  RunnerRoleArn:
    Value: !GetAtt RunnerRole.Arn
  RunnerUserName:
    Value: !Ref RunnerUser
